<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Amigos do Fogo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15110E">
<link rel="icon" href="fotos/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css?v=20261112182637">
<link rel="stylesheet" href="assets/admin.css?v=20261112182637">
</head>
<body class="adm">
<main id="tela-login" class="login">
  <form class="login-caixa" id="form-login" novalidate>
    <img src="fotos/logo.jpg" alt="" width="84" height="84">
    <h1>Painel do Fogo</h1>
    <p>Pedidos de orçamento do buffet, boutique e almoço.</p>
    <div class="credencial" role="note"><b>Acesso de demonstração</b><br>Usuário: <code>dono</code> · Senha: <code>fogo</code></div>
    <label for="l-user">Usuário</label><input id="l-user" autocomplete="username" autocapitalize="none">
    <label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password">
    <button class="bt bt-tinta" type="submit">Entrar</button>
    <p class="erro" id="login-erro" aria-live="polite"></p>
    <p><a href="index.html">Voltar para o site</a></p>
  </form>
</main>

<div id="tela-painel" hidden>
  <header class="adm-topo">
    <img src="fotos/logo.jpg" alt="" width="42" height="42">
    <b>Painel</b>
    <a class="bt bt-mini" href="index.html" target="_blank" rel="noopener">Ver site</a>
    <button class="bt bt-mini" id="btn-sair" type="button">Sair</button>
  </header>
  <div class="aviso-demo"><b>Modo demonstração.</b> Pedidos marcados "(exemplo)". Tudo fica só neste aparelho.</div>
  <main class="embrulho adm-main">
    <section id="aba-orcamentos" class="aba"></section>
    <section id="aba-boutique" class="aba" hidden></section>
    <section id="aba-almoco" class="aba" hidden></section>
    <section id="aba-ajustes" class="aba" hidden></section>
  </main>
  <nav class="abas" aria-label="Seções do painel">
    <button type="button" data-aba="orcamentos" aria-current="page">Orçamentos<span class="badge" id="badge" hidden></span></button>
    <button type="button" data-aba="boutique">Boutique</button>
    <button type="button" data-aba="almoco">Almoço</button>
    <button type="button" data-aba="ajustes">Ajustes</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="assets/dados.js?v=20261112182637"></script>
<script src="assets/admin.js?v=20261112182637"></script>
</body>
</html>
